variables:
  # GCE account related
  project_id: notnoopci-prototype
  account_file: ""

  # metadata for tagging
  circle_build_url: '{{ env "CIRCLE_BUILD_URL"}}'
  circle_job_name: '{{ env "CIRCLE_JOB" }}'
  helper_script_folder: "C:\\Program Files\\WindowsPowerShell\\Modules\\"
  test_script_folder: "C:\\tests"
  shutdown_script_folder: "C:\\shutdown-scripts"
  circle_sha: '{{ env "CIRCLE_SHA1" }}'
  circle_hostname: '{{ split (env "CIRCLE_BUILD_URL") "/" 2 }}'
  circle_workflow_id: '{{ env "CIRCLE_WORKFLOW_ID" }}'
  gce_region: '{{ split (user "gce_zone") "-" 0 }}'

  # Uncomment below to enable Docker registry mirror
  # IMPORTANT: Replace https://mirror.gcr.io with your custom registry
  # dockerhub_registry_mirror: 'https://mirror.gcr.io'

builders:
  - type: amazon-ebs
    access_key: ""
    secret_key: ""
    region: '{{ user "ami_region" }}'
    vpc_id: 'vpc-005f348e9ea84975f'
    subnet_id: 'subnet-0fb0f109343d86276'
    associate_public_ip_address: true
    source_ami_filter:
      filters:
        virtualization-type: "hvm"
        root-device-type: "ebs"
        name: "Windows_Server-2019-English-Full-ECS_Optimized-*"
      owners: ["amazon"]
      most_recent: true
    instance_type: "m5.2xlarge"
    ami_name: "windows-server-2019-vs2019-{{timestamp}}"
    user_data_file: ./windows2019/visual-studio/user_data.ps1
    communicator: "winrm"
    launch_block_device_mappings:
      - device_name: "/dev/sda1"
        volume_size: 160
        volume_type: "gp2"
        delete_on_termination: true
    winrm_username: '{{ user "windows_user" }}'
    winrm_insecure: true
    winrm_use_ssl: true
    winrm_timeout: "30m"
    tags:
      circle_build_url: '{{ user "circle_build_url" }}'
      circle_job_name: '{{ user "circle_job_name" }}'
      circle_sha: '{{ user "circle_sha" }}'
      monorepo_content_sha: '{{ user "monorepo_content_sha" }}'
    run_tags:
      circle_build_url: '{{ user "circle_build_url" }}'
    run_volume_tags:
      circle_build_url: '{{ user "circle_build_url" }}'

  - type: googlecompute
    network: packer
    image_name: windows-server-2019-vs2019-{{timestamp}}
    image_family: windows-server-2019-vs2019
    source_image_family: windows-2019
    # This used to be 80GB but visual studio consumed an addtional 30GB. So This
    # Was Doubled
    disk_size: 160
    # This is pd-ssd so that virus scan happens at a reasonable speed.
    disk_type: pd-ssd

    # Virus scan is much faster on a machine with a larger modern processer.
    machine_type: "n1-standard-8"

    project_id: '{{ user "project_id" }}'
    account_file: '{{ user "account_file" }}'
    zone: us-central1-a
    state_timeout: "30m"

    preemptible: false

    communicator: "winrm"
    winrm_username: '{{ user "windows_user" }}'
    winrm_insecure: true
    winrm_use_ssl: true
    winrm_timeout: "30m"

    metadata:
      windows-startup-script-cmd: |
        winrm set winrm/config/service/auth @{Basic=\"true\"}

      windows-shutdown-script-ps1: |
        & {{user `shutdown_script_folder`}}\GCEShutdownScript.ps1
        & {{user `shutdown_script_folder`}}\ShutdownScript.ps1

    image_labels:
      region: '{{ user "gce_region" }}'
      circle_hostname: '{{ user "circle_hostname" | clean_image_name }}'
      circle_workflow_id: '{{ user "circle_workflow_id" | clean_image_name }}'
      circle_job_name: '{{ user "circle_job_name" | clean_image_name }}'
      circle_sha: '{{ user "circle_sha" | clean_image_name }}'
      monorepo_content_sha: '{{ user "monorepo_content_sha" | clean_image_name }}'

provisioners:

  # START PERSISTENT NETWORK MONITORING
  - type: "powershell"
    inline:
      - "Write-Host 'Setting up persistent network monitoring...' -ForegroundColor Green"
      - ""
      - "# Create monitoring directory"
      - "New-Item -ItemType Directory -Path 'C:\\NetworkMonitoring' -Force | Out-Null"
      - "New-Item -ItemType Directory -Path 'C:\\NetworkMonitoring\\Data' -Force | Out-Null"
      - "$OutputPath = 'C:\\NetworkMonitoring'"
      - "$timestamp = Get-Date -Format 'yyyyMMdd-HHmmss'"
      - ""
      - "# 1. Enable persistent Windows logging that survives restarts"
      - "Write-Host 'Enabling persistent Windows logging...' -ForegroundColor Yellow"
      - ""
      - "# Enable DNS Client logging (survives restarts)"
      - "try {"
      - "    wevtutil sl 'Microsoft-Windows-DNS-Client/Operational' /e:true /q:true"
      - "    Write-Host 'DNS logging enabled' -ForegroundColor Green"
      - "} catch {"
      - "    Write-Warning 'Failed to enable DNS logging'"
      - "}"
      - ""
      - "# Enable firewall logging (survives restarts)"
      - "try {"
      - "    netsh advfirewall set allprofiles logging filename '$OutputPath\\firewall-persistent.log'"
      - "    netsh advfirewall set allprofiles logging maxfilesize 20480"
      - "    netsh advfirewall set allprofiles logging droppedconnections enable"
      - "    netsh advfirewall set allprofiles logging allowedconnections enable"
      - "    Write-Host 'Persistent firewall logging enabled' -ForegroundColor Green"
      - "} catch {"
      - "    Write-Warning 'Failed to configure firewall logging'"
      - "}"
      - ""
      - "# 2. Create a monitoring script that can restart itself"
      - "$monitoringScript = @'"
      - "# Persistent Network Monitor"
      - "$OutputPath = \"C:\\NetworkMonitoring\\Data\""
      - "$timestamp = Get-Date -Format \"yyyyMMdd-HHmmss\""
      - "$connectionFile = \"$OutputPath\\connections-all.csv\""
      - "$urlFile = \"$OutputPath\\urls-all.txt\""
      - "$processFile = \"$OutputPath\\processes-all.csv\""
      - ""
      - "# Initialize files if they don't exist"
      - "if (-not (Test-Path $connectionFile)) {"
      - "    \"Timestamp,LocalAddress,LocalPort,RemoteAddress,RemotePort,State,ProcessName,ProcessId,Boot\" | Out-File -FilePath $connectionFile -Encoding UTF8"
      - "}"
      - "if (-not (Test-Path $processFile)) {"
      - "    \"Timestamp,ProcessId,ProcessName,ProcessPath,CommandLine,Boot\" | Out-File -FilePath $processFile -Encoding UTF8"
      - "}"
      - ""
      - "$bootTime = (Get-CimInstance Win32_OperatingSystem).LastBootUpTime"
      - "$bootId = $bootTime.ToString(\"yyyyMMddHHmmss\")"
      - ""
      - "while ($true) {"
      - "    try {"
      - "        $ts = Get-Date -Format \"yyyy-MM-dd HH:mm:ss\""
      - "        "
      - "        # Monitor network connections"
      - "        $connections = Get-NetTCPConnection -State Established -ErrorAction SilentlyContinue"
      - "        foreach ($conn in $connections) {"
      - "            try {"
      - "                $process = Get-Process -Id $conn.OwningProcess -ErrorAction SilentlyContinue"
      - "                $processName = if ($process) { $process.ProcessName } else { \"Unknown\" }"
      - "                \"$ts,$($conn.LocalAddress),$($conn.LocalPort),$($conn.RemoteAddress),$($conn.RemotePort),$($conn.State),$processName,$($conn.OwningProcess),$bootId\" | Out-File -FilePath $connectionFile -Append -Encoding UTF8"
      - "            } catch { }"
      - "        }"
      - "        "
      - "        # Monitor processes with network activity"
      - "        $processes = Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -and ($_.CommandLine -match \"http\" -or $_.Name -match \"(curl|wget|powershell|msiexec|setup|choco)\") }"
      - "        foreach ($proc in $processes) {"
      - "            try {"
      - "                \"$ts,$($proc.ProcessId),$($proc.Name),$($proc.ExecutablePath),$($proc.CommandLine),$bootId\" | Out-File -FilePath $processFile -Append -Encoding UTF8"
      - "                "
      - "                # Extract URLs from command lines"
      - "                $urls = [regex]::Matches($proc.CommandLine, \"https?://[^\\s\\\"\\'']+\") | ForEach-Object { $_.Value }"
      - "                foreach ($url in $urls) {"
      - "                    \"$ts - $url - $bootId\" | Out-File -FilePath $urlFile -Append -Encoding UTF8"
      - "                }"
      - "            } catch { }"
      - "        }"
      - "        "
      - "        Start-Sleep -Seconds 15"
      - "    } catch {"
      - "        Start-Sleep -Seconds 5"
      - "    }"
      - "}"
      - "'@"
      - ""
      - "# Save the monitoring script"
      - "$monitoringScript | Out-File -FilePath '$OutputPath\\NetworkMonitor.ps1' -Encoding UTF8"
      - ""
      - "# 3. Create a scheduled task that starts at boot and runs continuously"
      - "Write-Host 'Creating persistent monitoring scheduled task...' -ForegroundColor Yellow"
      - "$taskAction = New-ScheduledTaskAction -Execute 'PowerShell.exe' -Argument '-WindowStyle Hidden -ExecutionPolicy Bypass -File C:\\NetworkMonitoring\\NetworkMonitor.ps1'"
      - "$taskTrigger = New-ScheduledTaskTrigger -AtStartup"
      - "$taskSettings = New-ScheduledTaskSettingsSet -AllowStartIfOnBatteries -DontStopIfGoingOnBatteries -StartWhenAvailable -RunOnlyIfNetworkAvailable:$false"
      - "$taskPrincipal = New-ScheduledTaskPrincipal -UserID 'SYSTEM' -LogonType ServiceAccount -RunLevel Highest"
      - ""
      - "try {"
      - "    Register-ScheduledTask -TaskName 'PackerNetworkMonitor' -Action $taskAction -Trigger $taskTrigger -Settings $taskSettings -Principal $taskPrincipal -Force"
      - "    Write-Host 'Scheduled task created successfully' -ForegroundColor Green"
      - "    "
      - "    # Start the task immediately"
      - "    Start-ScheduledTask -TaskName 'PackerNetworkMonitor'"
      - "    Write-Host 'Network monitoring started and will survive restarts' -ForegroundColor Green"
      - "} catch {"
      - "    Write-Warning 'Failed to create scheduled task, falling back to background job'"
      - "    # Fallback: start as background job for current session"
      - "    Start-Job -FilePath '$OutputPath\\NetworkMonitor.ps1'"
      - "}"
      - ""
      - "# 4. Create a startup flag to track monitoring status"
      - "$monitoringStatus = @{"
      - "    StartTime = Get-Date"
      - "    MonitoringMethod = 'ScheduledTask'"
      - "    TaskName = 'PackerNetworkMonitor'"
      - "    Status = 'Active'"
      - "    SurvivesRestart = $true"
      - "} | ConvertTo-Json"
      - "$monitoringStatus | Out-File -FilePath '$OutputPath\\monitoring-status.json' -Encoding UTF8"
      - ""
      - "Write-Host 'Persistent network monitoring setup complete!' -ForegroundColor Green"
      - "Write-Host 'Monitoring will continue through all restarts...' -ForegroundColor Cyan"
      - "Start-Sleep -Seconds 3"

  - type: file
    source: "windows2019/ImageHelpers"
    destination: "{{user `helper_script_folder`}}"

  - type: file
    source: "windows2019/validation-scripts"
    destination: "{{user `test_script_folder`}}"

  - type: file
    source: "windows2019/shutdown-scripts"
    destination: "C:\\"

  - type: powershell
    elevated_user: '{{ user "windows_user" }}'
    elevated_password: "{{.WinRMPassword}}"
    scripts:
      - "windows2019/provision-scripts/update-pwsh.ps1"
      # win update took more than 5 hour which is the limit for build run
      # - "windows2019/provision-scripts/install-windows-updates.ps1"
      - "windows2019/provision-scripts/cleanup-useless-defaults.ps1"
      - "windows2019/provision-scripts/dscConfig.ps1"

  - type: windows-restart

  # VERIFY MONITORING AFTER RESTART (add this after restart-causing provisioners)
  - type: "powershell"
    inline:
      - "Write-Host 'Verifying network monitoring after restart...' -ForegroundColor Cyan"
      - ""
      - "# Check if scheduled task is running"
      - "$task = Get-ScheduledTask -TaskName 'PackerNetworkMonitor' -ErrorAction SilentlyContinue"
      - "if ($task) {"
      - "    $taskInfo = Get-ScheduledTaskInfo -TaskName 'PackerNetworkMonitor'"
      - "    Write-Host \"Monitoring task status: $($taskInfo.LastTaskResult)\" -ForegroundColor Yellow"
      - "    "
      - "    if ($taskInfo.LastTaskResult -ne 0 -and $taskInfo.LastTaskResult -ne 267009) {"
      - "        Write-Host 'Restarting monitoring task...' -ForegroundColor Yellow"
      - "        Start-ScheduledTask -TaskName 'PackerNetworkMonitor'"
      - "    }"
      - "} else {"
      - "    Write-Warning 'Monitoring task not found, recreating...'"
      - "    # Recreate the task if it's missing"
      - "    $taskAction = New-ScheduledTaskAction -Execute 'PowerShell.exe' -Argument '-WindowStyle Hidden -ExecutionPolicy Bypass -File C:\\NetworkMonitoring\\NetworkMonitor.ps1'"
      - "    $taskTrigger = New-ScheduledTaskTrigger -AtStartup"
      - "    $taskSettings = New-ScheduledTaskSettingsSet -AllowStartIfOnBatteries -DontStopIfGoingOnBatteries -StartWhenAvailable"
      - "    $taskPrincipal = New-ScheduledTaskPrincipal -UserID 'SYSTEM' -LogonType ServiceAccount -RunLevel Highest"
      - "    Register-ScheduledTask -TaskName 'PackerNetworkMonitor' -Action $taskAction -Trigger $taskTrigger -Settings $taskSettings -Principal $taskPrincipal -Force"
      - "    Start-ScheduledTask -TaskName 'PackerNetworkMonitor'"
      - "    Write-Host 'Monitoring task recreated and started' -ForegroundColor Green"
      - "}"
      - ""
      - "# Show monitoring status"
      - "$dataFiles = Get-ChildItem -Path 'C:\\NetworkMonitoring\\Data' -File -ErrorAction SilentlyContinue"
      - "if ($dataFiles) {"
      - "    Write-Host 'Monitoring data files:' -ForegroundColor Green"
      - "    $dataFiles | ForEach-Object { Write-Host \"  $($_.Name) - $([math]::Round($_.Length/1KB,1)) KB\" -ForegroundColor Yellow }"
      - "} else {"
      - "    Write-Warning 'No monitoring data found'"
      - "}"

  - type: powershell
    elevated_user: '{{ user "windows_user" }}'
    elevated_password: "{{.WinRMPassword}}"
    scripts:
      - "windows2019/provision-scripts/dscConfig.ps1"
      # Uncomment below to change the system locale to Japan (CP932)
      # システム ロケールを日本 (CP932) にする場合は下記を有効にしてください
      # - "windows2019/provision-scripts/localize.ps1"

  - type: windows-restart

  # VERIFY MONITORING AFTER RESTART (add this after restart-causing provisioners)
  - type: "powershell"
    inline:
      - "Write-Host 'Verifying network monitoring after restart...' -ForegroundColor Cyan"
      - ""
      - "# Check if scheduled task is running"
      - "$task = Get-ScheduledTask -TaskName 'PackerNetworkMonitor' -ErrorAction SilentlyContinue"
      - "if ($task) {"
      - "    $taskInfo = Get-ScheduledTaskInfo -TaskName 'PackerNetworkMonitor'"
      - "    Write-Host \"Monitoring task status: $($taskInfo.LastTaskResult)\" -ForegroundColor Yellow"
      - "    "
      - "    if ($taskInfo.LastTaskResult -ne 0 -and $taskInfo.LastTaskResult -ne 267009) {"
      - "        Write-Host 'Restarting monitoring task...' -ForegroundColor Yellow"
      - "        Start-ScheduledTask -TaskName 'PackerNetworkMonitor'"
      - "    }"
      - "} else {"
      - "    Write-Warning 'Monitoring task not found, recreating...'"
      - "    # Recreate the task if it's missing"
      - "    $taskAction = New-ScheduledTaskAction -Execute 'PowerShell.exe' -Argument '-WindowStyle Hidden -ExecutionPolicy Bypass -File C:\\NetworkMonitoring\\NetworkMonitor.ps1'"
      - "    $taskTrigger = New-ScheduledTaskTrigger -AtStartup"
      - "    $taskSettings = New-ScheduledTaskSettingsSet -AllowStartIfOnBatteries -DontStopIfGoingOnBatteries -StartWhenAvailable"
      - "    $taskPrincipal = New-ScheduledTaskPrincipal -UserID 'SYSTEM' -LogonType ServiceAccount -RunLevel Highest"
      - "    Register-ScheduledTask -TaskName 'PackerNetworkMonitor' -Action $taskAction -Trigger $taskTrigger -Settings $taskSettings -Principal $taskPrincipal -Force"
      - "    Start-ScheduledTask -TaskName 'PackerNetworkMonitor'"
      - "    Write-Host 'Monitoring task recreated and started' -ForegroundColor Green"
      - "}"
      - ""
      - "# Show monitoring status"
      - "$dataFiles = Get-ChildItem -Path 'C:\\NetworkMonitoring\\Data' -File -ErrorAction SilentlyContinue"
      - "if ($dataFiles) {"
      - "    Write-Host 'Monitoring data files:' -ForegroundColor Green"
      - "    $dataFiles | ForEach-Object { Write-Host \"  $($_.Name) - $([math]::Round($_.Length/1KB,1)) KB\" -ForegroundColor Yellow }"
      - "} else {"
      - "    Write-Warning 'No monitoring data found'"
      - "}"

  - type: powershell
    elevated_user: '{{ user "windows_user" }}'
    elevated_password: "{{.WinRMPassword}}"
    # Uncomment below to enable Docker registry mirror value to be passed as an environment variable
    # NOTE: Packer will quote strings by default
    # See https://developer.hashicorp.com/packer/docs/provisioners/shell#env_var_format
    # environment_vars:
    #   - DOCKERHUB_REGISTRY_MIRROR={{ user "dockerhub_registry_mirror" }}
    scripts:
      - "windows2019/provision-scripts/install-ssh.ps1"
      - "windows2019/provision-scripts/update-pester.ps1"
      - "windows2019/provision-scripts/enable-ec2launch.ps1"
      - "windows2019/provision-scripts/enable-cleanup.ps1"
      # Uncomment below to enable Docker registry mirror
      # NOTE: this script requires the DOCKERHUB_REGISTRY_MIRROR environment variable
      # - "windows2019/provision-scripts/configure-docker-daemon.ps1"
      - "windows2019/provision-scripts/disable-windows-defender-scanner.ps1"
      # The following errors as windows update did not run
      # - "windows2019/validation-scripts/run-pester.ps1"

  # STOP MONITORING AND ANALYZE
  - type: "powershell"
    inline:
      - "Write-Host 'Stopping persistent network monitoring and analyzing results...' -ForegroundColor Green"
      - ""
      - "# Stop the scheduled task"
      - "try {"
      - "    Stop-ScheduledTask -TaskName 'PackerNetworkMonitor' -ErrorAction SilentlyContinue"
      - "    Unregister-ScheduledTask -TaskName 'PackerNetworkMonitor' -Confirm:$false -ErrorAction SilentlyContinue"
      - "    Write-Host 'Monitoring task stopped and removed' -ForegroundColor Green"
      - "} catch {"
      - "    Write-Warning 'Failed to stop monitoring task'"
      - "}"
      - ""
      - "# Disable persistent logging"
      - "try {"
      - "    wevtutil sl 'Microsoft-Windows-DNS-Client/Operational' /e:false /q:true"
      - "    netsh advfirewall set allprofiles logging droppedconnections disable"
      - "    netsh advfirewall set allprofiles logging allowedconnections disable"
      - "} catch { }"
      - ""
      - "# Wait a moment for final data collection"
      - "Start-Sleep -Seconds 10"
      - "Write-Host 'Monitoring stopped, beginning analysis...' -ForegroundColor Yellow"

  # ANALYZE PERSISTENT MONITORING DATA
  - type: "powershell"
    inline:
      - "Write-Host 'Analyzing persistent network monitoring data...' -ForegroundColor Green"
      - ""
      - "$OutputPath = 'C:\\NetworkMonitoring'"
      - "$DataPath = 'C:\\NetworkMonitoring\\Data'"
      - "$allConnections = @()"
      - "$allUrls = @()"
      - "$allProcesses = @()"
      - "$allDomains = @()"
      - ""
      - "# Process persistent connection data"
      - "Write-Host 'Processing connection data...' -ForegroundColor Cyan"
      - "$connectionFile = '$DataPath\\connections-all.csv'"
      - "if (Test-Path $connectionFile) {"
      - "    try {"
      - "        $connections = Import-Csv -Path $connectionFile"
      - "        $allConnections = $connections"
      - "        Write-Host \"Processed $($connections.Count) total connections across all restarts\" -ForegroundColor Yellow"
      - "        "
      - "        # Show connections by boot session"
      - "        $bootSessions = $connections | Group-Object Boot"
      - "        Write-Host \"Data collected across $($bootSessions.Count) boot sessions:\" -ForegroundColor Cyan"
      - "        foreach ($session in $bootSessions) {"
      - "            Write-Host \"  Boot $($session.Name): $($session.Count) connections\" -ForegroundColor Yellow"
      - "        }"
      - "    } catch {"
      - "        Write-Warning 'Failed to process connection data'"
      - "    }"
      - "} else {"
      - "    Write-Warning 'No connection data file found'"
      - "}"
      - ""
      - "# Process persistent URL data"
      - "Write-Host 'Processing URL data...' -ForegroundColor Cyan" 
      - "$urlFile = '$DataPath\\urls-all.txt'"
      - "if (Test-Path $urlFile) {"
      - "    try {"
      - "        $urlLines = Get-Content -Path $urlFile"
      - "        $urls = $urlLines | ForEach-Object {"
      - "            if ($_ -match '^.* - (https?://[^\\s]+) - .*$') {"
      - "                $matches[1]"
      - "            }"
      - "        } | Sort-Object -Unique"
      - "        $allUrls = $urls"
      - "        Write-Host \"Processed $($urls.Count) unique URLs\" -ForegroundColor Yellow"
      - "    } catch {"
      - "        Write-Warning 'Failed to process URL data'"
      - "    }"
      - "} else {"
      - "    Write-Warning 'No URL data file found'"
      - "}"
      - ""
      - "# Process DNS logs"
      - "Write-Host 'Processing DNS query data...' -ForegroundColor Cyan"
      - "$dnsEvents = @()"
      - "try {"
      - "    $events = Get-WinEvent -FilterHashtable @{LogName='Microsoft-Windows-DNS-Client/Operational'} -MaxEvents 10000 -ErrorAction SilentlyContinue"
      - "    $dnsQueries = $events | Where-Object { $_.Id -eq 3008 } | ForEach-Object {"
      - "        try {"
      - "            $xml = [xml]$_.ToXml()"
      - "            $queryName = $xml.Event.EventData.Data | Where-Object { $_.Name -eq 'QueryName' } | Select-Object -ExpandProperty '#text'"
      - "            if ($queryName) { $queryName }"
      - "        } catch { }"
      - "    } | Sort-Object -Unique"
      - "    Write-Host \"Collected $($dnsQueries.Count) unique DNS queries\" -ForegroundColor Yellow"
      - "    $allDomains += $dnsQueries"
      - "} catch {"
      - "    Write-Warning 'Failed to process DNS events'"
      - "}"
      - ""
      - "# Extract domains from URLs"
      - "$domains = $allUrls | ForEach-Object {"
      - "    try {"
      - "        $uri = [System.Uri]$_"
      - "        $uri.Host"
      - "    } catch { }"
      - "} | Where-Object { $_ }"
      - ""
      - "$allDomains += $domains"
      - "$uniqueDomains = $allDomains | Where-Object { $_ -and $_ -match '\\.' } | Sort-Object -Unique"
      - ""
      - "# Extract unique destinations"
      - "$uniqueDestinations = $allConnections | Where-Object { $_.RemoteAddress -and $_.RemoteAddress -ne '0.0.0.0' -and $_.RemoteAddress -ne '127.0.0.1' } | Group-Object RemoteAddress, RemotePort | ForEach-Object { $_.Group | Select-Object -First 1 } | Sort-Object RemoteAddress"
      - ""
      - "# Categorize domains"
      - "$microsoftDomains = $uniqueDomains | Where-Object { $_ -match 'microsoft|windowsupdate|office|azure' }"
      - "$awsDomains = $uniqueDomains | Where-Object { $_ -match 'amazonaws|aws' }"
      - "$circleciDomains = $uniqueDomains | Where-Object { $_ -match 'circleci|circleimg' }"
      - "$packageMgrDomains = $uniqueDomains | Where-Object { $_ -match 'chocolatey|nuget|npmjs|pypi|github|githubusercontent' }"
      - "$cdnDomains = $uniqueDomains | Where-Object { $_ -match 'cdn|cloudflare|fastly|akamai' }"
      - "$otherDomains = $uniqueDomains | Where-Object { $_ -notmatch 'microsoft|windowsupdate|office|azure|amazonaws|aws|circleci|circleimg|chocolatey|nuget|npmjs|pypi|github|githubusercontent|cdn|cloudflare|fastly|akamai' }"
      - ""
      - "# Generate Security Group rules"
      - "$securityGroupRules = @()"
      - "$portGroups = $uniqueDestinations | Group-Object RemotePort"
      - "foreach ($portGroup in $portGroups) {"
      - "    $port = $portGroup.Name"
      - "    if ($port -in @('80', '443', '53', '22', '3389')) {"
      - "        $addresses = $portGroup.Group.RemoteAddress | Sort-Object -Unique"
      - "        $rule = @{"
      - "            Protocol = if ($port -eq '53') { 'udp' } else { 'tcp' }"
      - "            Port = $port"
      - "            Destinations = $addresses"
      - "            Description = switch ($port) {"
      - "                '80' { 'HTTP outbound' }"
      - "                '443' { 'HTTPS outbound' }"
      - "                '53' { 'DNS queries' }"
      - "                '22' { 'SSH outbound' }"
      - "                '3389' { 'RDP outbound' }"
      - "            }"
      - "        }"
      - "        $securityGroupRules += $rule"
      - "    }"
      - "}"
      - ""
      - "# Create analysis results"
      - "$analysisResults = @{"
      - "    Timestamp = Get-Date"
      - "    MonitoringMethod = 'PersistentScheduledTask'"
      - "    SurvivedRestarts = $true"
      - "    Summary = @{"
      - "        TotalConnections = $allConnections.Count"
      - "        UniqueDestinations = $uniqueDestinations.Count"
      - "        UniqueDomains = $uniqueDomains.Count"  
      - "        TotalUrls = $allUrls.Count"
      - "        SecurityGroupRules = $securityGroupRules.Count"
      - "        BootSessions = ($allConnections | Group-Object Boot).Count"
      - "    }"
      - "    UniqueDestinations = $uniqueDestinations"
      - "    SecurityGroupRules = $securityGroupRules"
      - "    DomainCategories = @{"
      - "        Microsoft = $microsoftDomains"
      - "        AWS = $awsDomains"
      - "        CircleCI = $circleciDomains"
      - "        PackageManagers = $packageMgrDomains"
      - "        CDN = $cdnDomains"
      - "        Other = $otherDomains"
      - "    }"
      - "}"
      - ""
      - "# Save results (same format as before)"
      - "Write-Host 'Saving persistent monitoring analysis...' -ForegroundColor Cyan"
      - "$analysisResults | ConvertTo-Json -Depth 10 | Out-File -FilePath '$OutputPath\\network-analysis-report.json' -Encoding UTF8"
      - ""
      - "# Save Security Group rules"
      - "$sgRulesAwsCli = $securityGroupRules | ForEach-Object {"
      - "    @{"
      - "        IpPermissions = @("
      - "            @{"
      - "                IpProtocol = $_.Protocol"
      - "                FromPort = [int]$_.Port"
      - "                ToPort = [int]$_.Port"
      - "                IpRanges = $_.Destinations | ForEach-Object { @{ CidrIp = \"$_/32\"; Description = $_.Description } }"
      - "            }"
      - "        )"
      - "    }"
      - "}"
      - "$sgRulesAwsCli | ConvertTo-Json -Depth 5 | Out-File -FilePath '$OutputPath\\security-group-rules.json' -Encoding UTF8"
      - ""
      - "# Save domain lists"
      - "$uniqueDomains | Out-File -FilePath '$OutputPath\\domain-allowlist.txt' -Encoding UTF8"
      - "$microsoftDomains | Out-File -FilePath '$OutputPath\\domains-Microsoft.txt' -Encoding UTF8"
      - "$awsDomains | Out-File -FilePath '$OutputPath\\domains-AWS.txt' -Encoding UTF8"
      - "$circleciDomains | Out-File -FilePath '$OutputPath\\domains-CircleCI.txt' -Encoding UTF8"
      - "$packageMgrDomains | Out-File -FilePath '$OutputPath\\domains-PackageManagers.txt' -Encoding UTF8"
      - "$cdnDomains | Out-File -FilePath '$OutputPath\\domains-CDN.txt' -Encoding UTF8"
      - "$otherDomains | Out-File -FilePath '$OutputPath\\domains-Other.txt' -Encoding UTF8"
      - ""
      - "# Create enhanced summary report"
      - "$summaryReport = @\""
      - "# Persistent Network Traffic Analysis Report"
      - "Generated: $(Get-Date)"
      - "Monitoring Method: Persistent Scheduled Task (Restart-Resistant)"
      - ""
      - "## Summary Statistics"
      - "- Total Network Connections: $($analysisResults.Summary.TotalConnections)"
      - "- Unique Destinations: $($analysisResults.Summary.UniqueDestinations)"
      - "- Unique Domains: $($analysisResults.Summary.UniqueDomains)"
      - "- URLs Captured: $($analysisResults.Summary.TotalUrls)"
      - "- Security Group Rules: $($analysisResults.Summary.SecurityGroupRules)"
      - "- Boot Sessions Monitored: $($analysisResults.Summary.BootSessions)"
      - ""
      - "## Domain Categories"
      - "- Microsoft/Windows: $($microsoftDomains.Count) domains"
      - "- AWS: $($awsDomains.Count) domains" 
      - "- CircleCI: $($circleciDomains.Count) domains"
      - "- Package Managers: $($packageMgrDomains.Count) domains"
      - "- CDN: $($cdnDomains.Count) domains"
      - "- Other: $($otherDomains.Count) domains"
      - ""
      - "## Monitoring Notes"
      - "- Monitoring survived all Windows restarts during build"
      - "- Data collected continuously using Windows scheduled tasks"
      - "- DNS queries captured from Windows Event Log"
      - "- Firewall logs collected persistently"
      - "\"@"
      - ""
      - "$summaryReport | Out-File -FilePath '$OutputPath\\ANALYSIS-SUMMARY.md' -Encoding UTF8"
      - ""
      - "Write-Host '=== PERSISTENT NETWORK ANALYSIS COMPLETE ===' -ForegroundColor Green"
      - "Write-Host \"Total Connections: $($analysisResults.Summary.TotalConnections)\" -ForegroundColor Yellow"
      - "Write-Host \"Unique Destinations: $($analysisResults.Summary.UniqueDestinations)\" -ForegroundColor Yellow"
      - "Write-Host \"Unique Domains: $($analysisResults.Summary.UniqueDomains)\" -ForegroundColor Yellow"
      - "Write-Host \"Boot Sessions: $($analysisResults.Summary.BootSessions)\" -ForegroundColor Yellow"
      - "Write-Host \"Analysis files ready for download\" -ForegroundColor Cyan"

