variables:
  # GCE account related
  project_id: notnoopci-prototype
  account_file: ""

  # metadata for tagging
  circle_build_url: '{{ env "CIRCLE_BUILD_URL"}}'
  circle_job_name: '{{ env "CIRCLE_JOB" }}'
  helper_script_folder: "C:\\Program Files\\WindowsPowerShell\\Modules\\"
  test_script_folder: "C:\\tests"
  shutdown_script_folder: "C:\\shutdown-scripts"
  circle_sha: '{{ env "CIRCLE_SHA1" }}'
  circle_hostname: '{{ split (env "CIRCLE_BUILD_URL") "/" 2 }}'
  circle_workflow_id: '{{ env "CIRCLE_WORKFLOW_ID" }}'
  gce_region: '{{ split (user "gce_zone") "-" 0 }}'

  # Uncomment below to enable Docker registry mirror
  # IMPORTANT: Replace https://mirror.gcr.io with your custom registry
  # dockerhub_registry_mirror: 'https://mirror.gcr.io'

builders:
  - type: amazon-ebs
    access_key: ""
    secret_key: ""
    region: '{{ user "ami_region" }}'
    vpc_id: 'vpc-005f348e9ea84975f'
    subnet_id: 'subnet-0fb0f109343d86276'
    associate_public_ip_address: true
    source_ami_filter:
      filters:
        virtualization-type: "hvm"
        root-device-type: "ebs"
        name: "Windows_Server-2019-English-Full-ECS_Optimized-*"
      owners: ["amazon"]
      most_recent: true
    instance_type: "m5.2xlarge"
    ami_name: "windows-server-2019-vs2019-{{timestamp}}"
    user_data_file: ./windows2019/visual-studio/user_data.ps1
    communicator: "winrm"
    launch_block_device_mappings:
      - device_name: "/dev/sda1"
        volume_size: 160
        volume_type: "gp2"
        delete_on_termination: true
    winrm_username: '{{ user "windows_user" }}'
    winrm_insecure: true
    winrm_use_ssl: true
    winrm_timeout: "30m"
    tags:
      circle_build_url: '{{ user "circle_build_url" }}'
      circle_job_name: '{{ user "circle_job_name" }}'
      circle_sha: '{{ user "circle_sha" }}'
      monorepo_content_sha: '{{ user "monorepo_content_sha" }}'
    run_tags:
      circle_build_url: '{{ user "circle_build_url" }}'
    run_volume_tags:
      circle_build_url: '{{ user "circle_build_url" }}'

  - type: googlecompute
    network: packer
    image_name: windows-server-2019-vs2019-{{timestamp}}
    image_family: windows-server-2019-vs2019
    source_image_family: windows-2019
    # This used to be 80GB but visual studio consumed an addtional 30GB. So This
    # Was Doubled
    disk_size: 160
    # This is pd-ssd so that virus scan happens at a reasonable speed.
    disk_type: pd-ssd

    # Virus scan is much faster on a machine with a larger modern processer.
    machine_type: "n1-standard-8"

    project_id: '{{ user "project_id" }}'
    account_file: '{{ user "account_file" }}'
    zone: us-central1-a
    state_timeout: "30m"

    preemptible: false

    communicator: "winrm"
    winrm_username: '{{ user "windows_user" }}'
    winrm_insecure: true
    winrm_use_ssl: true
    winrm_timeout: "30m"

    metadata:
      windows-startup-script-cmd: |
        winrm set winrm/config/service/auth @{Basic=\"true\"}

      windows-shutdown-script-ps1: |
        & {{user `shutdown_script_folder`}}\GCEShutdownScript.ps1
        & {{user `shutdown_script_folder`}}\ShutdownScript.ps1

    image_labels:
      region: '{{ user "gce_region" }}'
      circle_hostname: '{{ user "circle_hostname" | clean_image_name }}'
      circle_workflow_id: '{{ user "circle_workflow_id" | clean_image_name }}'
      circle_job_name: '{{ user "circle_job_name" | clean_image_name }}'
      circle_sha: '{{ user "circle_sha" | clean_image_name }}'
      monorepo_content_sha: '{{ user "monorepo_content_sha" | clean_image_name }}'

provisioners:

  - type: file
    source: "windows2019/ImageHelpers"
    destination: "{{user `helper_script_folder`}}"

  - type: file
    source: "windows2019/validation-scripts"
    destination: "{{user `test_script_folder`}}"

  - type: file
    source: "windows2019/shutdown-scripts"
    destination: "C:\\"

  - type: powershell
    elevated_user: '{{ user "windows_user" }}'
    elevated_password: "{{.WinRMPassword}}"
    scripts:
      - "windows2019/monitoring-scripts/Start-NetworkMonitoring.ps1"
      - "windows2019/provision-scripts/update-pwsh.ps1"
      # win update took more than 5 hour which is the limit for build run
      # - "windows2019/provision-scripts/install-windows-updates.ps1"
      - "windows2019/provision-scripts/cleanup-useless-defaults.ps1"
      - "windows2019/provision-scripts/dscConfig.ps1"

  - type: windows-restart

  - type: powershell
    elevated_user: '{{ user "windows_user" }}'
    elevated_password: "{{.WinRMPassword}}"
    scripts:
      - "windows2019/monitoring-scripts/Verify-NetworkMonitoring.ps1"
      - "windows2019/provision-scripts/dscConfig.ps1"
      # Uncomment below to change the system locale to Japan (CP932)
      # システム ロケールを日本 (CP932) にする場合は下記を有効にしてください
      # - "windows2019/provision-scripts/localize.ps1"


  # CloudWatch Agent Installation
  # Replace <log_place> with your desired CloudWatch log group name
  - type: powershell
    elevated_user: '{{ user "windows_user" }}'
    elevated_password: "{{.WinRMPassword}}"
    inline:
      - "Write-Host 'Installing AWS CloudWatch Agent for CircleCI Windows AMI...'"
      - "$ProgressPreference = 'SilentlyContinue'"
      - "$ErrorActionPreference = 'Stop'"
      - ""
      - "# Create temp directory"
      - "New-Item -ItemType Directory -Force -Path 'C:\\temp' | Out-Null"
      - ""
      - "# Download CloudWatch Agent"
      - "Write-Host 'Downloading CloudWatch Agent...'"
      - "$agentUrl = 'https://s3.amazonaws.com/amazoncloudwatch-agent/windows/amd64/latest/amazon-cloudwatch-agent.msi'"
      - "$agentPath = 'C:\\temp\\amazon-cloudwatch-agent.msi'"
      - "Invoke-WebRequest -Uri $agentUrl -OutFile $agentPath -UseBasicParsing"
      - ""
      - "# Install CloudWatch Agent"
      - "Write-Host 'Installing CloudWatch Agent...'"
      - "Start-Process -FilePath 'msiexec.exe' -ArgumentList '/i', $agentPath, '/quiet', '/norestart' -Wait -NoNewWindow"
      - ""
      - "# Create configuration directory"
      - "$configDir = 'C:\\ProgramData\\Amazon\\AmazonCloudWatchAgent'"
      - "New-Item -ItemType Directory -Force -Path $configDir | Out-Null"
      - ""
      - "# Create CloudWatch Agent JSON configuration using .NET to avoid BOM"
      - "Write-Host 'Creating CloudWatch Agent configuration...'"
      - "$config = @{"
      - "  logs = @{"
      - "    logs_collected = @{"
      - "      files = @{"
      - "        collect_list = @("
      - "          @{"
      - "            file_path = 'C:\\\\temp\\\\circleci.log'"
      - "            log_group_name = '/aws/eks/naoya-cci-server-se/windows'"
      - "            log_stream_name = '{instance_id}'"
      - "            timezone = 'UTC'"
      - "          },"
      - "          @{"
      - "            file_path = 'C:\\\\temp\\\\circleci-agent.log'"
      - "            log_group_name = '/aws/eks/naoya-cci-server-se/windows-agent'"
      - "            log_stream_name = '{instance_id}-agent'"
      - "            timezone = 'UTC'"
      - "          }"
      - "        )"
      - "      }"
      - "      windows_events = @{"
      - "        collect_list = @("
      - "          @{"
      - "            event_name = 'System'"
      - "            event_levels = @('ERROR', 'WARNING', 'CRITICAL')"
      - "            log_group_name = '/aws/eks/naoya-cci-server-se/windows-system'"
      - "            log_stream_name = '{instance_id}-system'"
      - "          },"
      - "          @{"
      - "            event_name = 'Application'"
      - "            event_levels = @('ERROR', 'WARNING', 'CRITICAL')"
      - "            log_group_name = '/aws/eks/naoya-cci-server-se/windows-application'"
      - "            log_stream_name = '{instance_id}-application'"
      - "          }"
      - "        )"
      - "      }"
      - "    }"
      - "  }"
      - "  metrics = @{"
      - "    namespace = 'CircleCI/Windows'"
      - "    metrics_collected = @{"
      - "      cpu = @{"
      - "        measurement = @('cpu_usage_idle', 'cpu_usage_user', 'cpu_usage_system')"
      - "        metrics_collection_interval = 60"
      - "      }"
      - "      memory = @{"
      - "        measurement = @('mem_used_percent')"
      - "        metrics_collection_interval = 60"
      - "      }"
      - "      disk = @{"
      - "        measurement = @('used_percent')"
      - "        metrics_collection_interval = 60"
      - "        resources = @('*')"
      - "      }"
      - "    }"
      - "  }"
      - "}"
      - ""
      - "# Convert to JSON and save without BOM using .NET"
      - "$configPath = Join-Path $configDir 'amazon-cloudwatch-agent.json'"
      - "$jsonString = $config | ConvertTo-Json -Depth 10"
      - "$utf8NoBom = New-Object System.Text.UTF8Encoding($false)"
      - "[System.IO.File]::WriteAllText($configPath, $jsonString, $utf8NoBom)"
      - ""
      - "# Validate the JSON file was created correctly"
      - "Write-Host 'Validating configuration file...'"
      - "if (Test-Path $configPath) {"
      - "  $fileSize = (Get-Item $configPath).Length"
      - "  Write-Host \"Configuration file created: $configPath ($fileSize bytes)\""
      - "  "
      - "  # Check for BOM"
      - "  $bytes = [System.IO.File]::ReadAllBytes($configPath)"
      - "  if ($bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF) {"
      - "    Write-Warning 'BOM detected in configuration file!'"
      - "  } else {"
      - "    Write-Host 'Configuration file created without BOM - Good!'"
      - "  }"
      - "} else {"
      - "  throw 'Configuration file was not created'"
      - "}"
      - ""
      - "# Configure service to start automatically (but don't start it now)"
      - "Write-Host 'Setting CloudWatch Agent to start automatically...'"
      - "Set-Service -Name 'AmazonCloudWatchAgent' -StartupType Automatic"
      - ""
      - "# Create log directories"
      - "Write-Host 'Creating log directories...'"
      - "New-Item -ItemType Directory -Force -Path 'C:\\temp' | Out-Null"
      - "New-Item -ItemType Directory -Force -Path 'C:\\Program Files\\CircleCI\\logs' -ErrorAction SilentlyContinue | Out-Null"
      - ""
      - "# Create startup script to start CloudWatch Agent on first boot"
      - "Write-Host 'Creating CloudWatch Agent startup script...'"
      - "$startupScript = @'"
      - "# CloudWatch Agent Startup Script"
      - "try {"
      - "  Write-EventLog -LogName Application -Source 'CloudWatch Agent' -EventId 1001 -EntryType Information -Message 'Starting CloudWatch Agent configuration...'"
      - "  "
      - "  $configPath = 'C:\\ProgramData\\Amazon\\AmazonCloudWatchAgent\\amazon-cloudwatch-agent.json'"
      - "  if (Test-Path $configPath) {"
      - "    & 'C:\\Program Files\\Amazon\\AmazonCloudWatchAgent\\amazon-cloudwatch-agent-ctl.ps1' -a fetch-config -m ec2 -s -c \"file:$configPath\""
      - "    Write-EventLog -LogName Application -Source 'CloudWatch Agent' -EventId 1002 -EntryType Information -Message 'CloudWatch Agent started successfully'"
      - "  } else {"
      - "    Write-EventLog -LogName Application -Source 'CloudWatch Agent' -EventId 1003 -EntryType Error -Message 'CloudWatch Agent configuration file not found'"
      - "  }"
      - "} catch {"
      - "  Write-EventLog -LogName Application -Source 'CloudWatch Agent' -EventId 1004 -EntryType Error -Message \"CloudWatch Agent startup failed: $($_.Exception.Message)\""
      - "}"
      - "'@"
      - ""
      - "$startupScriptPath = 'C:\\Windows\\System32\\GroupPolicy\\Machine\\Scripts\\Startup\\start-cloudwatch-agent.ps1'"
      - "New-Item -ItemType Directory -Force -Path (Split-Path $startupScriptPath) | Out-Null"
      - "$utf8NoBom = New-Object System.Text.UTF8Encoding($false)"
      - "[System.IO.File]::WriteAllText($startupScriptPath, $startupScript, $utf8NoBom)"
      - ""
      - "# Register the startup script"
      - "$gpoScriptsPath = 'C:\\Windows\\System32\\GroupPolicy\\Machine\\Scripts\\scripts.ini'"
      - "$scriptsIni = @'"
      - "[Startup]"
      - "0CmdLine=powershell.exe -ExecutionPolicy Bypass -File C:\\Windows\\System32\\GroupPolicy\\Machine\\Scripts\\Startup\\start-cloudwatch-agent.ps1"
      - "0Parameters="
      - "'@"
      - "[System.IO.File]::WriteAllText($gpoScriptsPath, $scriptsIni, $utf8NoBom)"
      - ""
      - "# Create Windows Event Log source"
      - "try {"
      - "  New-EventLog -LogName Application -Source 'CloudWatch Agent' -ErrorAction SilentlyContinue"
      - "} catch {"
      - "  # Source might already exist, ignore error"
      - "}"
      - ""
      - "# Cleanup installation file"
      - "Remove-Item -Path $agentPath -Force -ErrorAction SilentlyContinue"
      - ""
      - "# Final verification"
      - "Write-Host 'Verifying CloudWatch Agent installation...'"
      - "$service = Get-Service -Name 'AmazonCloudWatchAgent' -ErrorAction SilentlyContinue"
      - "if ($service) {"
      - "  Write-Host \"CloudWatch Agent service status: $($service.Status)\""
      - "  Write-Host \"CloudWatch Agent startup type: $($service.StartType)\""
      - "} else {"
      - "  Write-Warning 'CloudWatch Agent service not found!'"
      - "}"
      - ""
      - "Write-Host 'CloudWatch Agent installation completed successfully!'"
      - "Write-Host 'Agent will start automatically when instances launch from this AMI.'"

# Verify CloudWatch Agent Installation
  - type: powershell
    elevated_user: '{{ user "windows_user" }}'
    elevated_password: "{{.WinRMPassword}}"
    inline:
      - "Write-Host 'Verifying CloudWatch Agent installation...'"
      - ""
      - "# Check service exists and is set to automatic"
      - "$service = Get-Service -Name 'AmazonCloudWatchAgent' -ErrorAction SilentlyContinue"
      - "if ($service -and $service.StartType -eq 'Automatic') {"
      - "  Write-Host '✅ CloudWatch Agent service configured correctly'"
      - "} else {"
      - "  Write-Error '❌ CloudWatch Agent service not found or not set to automatic'"
      - "}"
      - ""
      - "# Check configuration file exists and has no BOM"
      - "$configPath = 'C:\\ProgramData\\Amazon\\AmazonCloudWatchAgent\\amazon-cloudwatch-agent.json'"
      - "if (Test-Path $configPath) {"
      - "  $bytes = [System.IO.File]::ReadAllBytes($configPath)"
      - "  if ($bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF) {"
      - "    Write-Error '❌ Configuration file has BOM'"
      - "  } else {"
      - "    Write-Host '✅ Configuration file exists without BOM'"
      - "  }"
      - "} else {"
      - "  Write-Error '❌ Configuration file not found'"
      - "}"
      - ""
      - "# Check startup script exists"
      - "$startupScript = 'C:\\Windows\\System32\\GroupPolicy\\Machine\\Scripts\\Startup\\start-cloudwatch-agent.ps1'"
      - "if (Test-Path $startupScript) {"
      - "  Write-Host '✅ Startup script created'"
      - "} else {"
      - "  Write-Error '❌ Startup script not found'"
      - "}"
      - ""
      - "Write-Host 'CloudWatch Agent verification completed.'"

  - type: windows-restart

  - type: powershell
    elevated_user: '{{ user "windows_user" }}'
    elevated_password: "{{.WinRMPassword}}"
    # Uncomment below to enable Docker registry mirror value to be passed as an environment variable
    # NOTE: Packer will quote strings by default
    # See https://developer.hashicorp.com/packer/docs/provisioners/shell#env_var_format
    # environment_vars:
    #   - DOCKERHUB_REGISTRY_MIRROR={{ user "dockerhub_registry_mirror" }}
    scripts:
      - "windows2019/monitoring-scripts/Verify-NetworkMonitoring.ps1"
      - "windows2019/provision-scripts/install-ssh.ps1"
      - "windows2019/provision-scripts/update-pester.ps1"
      - "windows2019/provision-scripts/enable-ec2launch.ps1"
      - "windows2019/provision-scripts/enable-cleanup.ps1"
      # Uncomment below to enable Docker registry mirror
      # NOTE: this script requires the DOCKERHUB_REGISTRY_MIRROR environment variable
      # - "windows2019/provision-scripts/configure-docker-daemon.ps1"
      - "windows2019/provision-scripts/disable-windows-defender-scanner.ps1"
      # The following errors as windows update did not run
      # - "windows2019/validation-scripts/run-pester.ps1"

  # Stop monitoring and analyze results
  - type: "powershell"
    elevated_user: "{{ user `windows_user` }}"
    elevated_password: "{{.WinRMPassword}}"
    scripts:
      - "windows2019/monitoring-scripts/Stop-NetworkMonitoring.ps1"

  # Download all analysis results
  - type: "file"
    source: "C:\\NetworkMonitoring\\network-analysis-report.json"
    destination: "./output/network-analysis-{{timestamp}}.json"
    direction: "download"

  - type: "file"
    source: "C:\\NetworkMonitoring\\security-group-rules.json"
    destination: "./output/security-group-rules-{{timestamp}}.json"
    direction: "download"

  - type: "file"
    source: "C:\\NetworkMonitoring\\domain-allowlist.txt"
    destination: "./output/domain-allowlist-{{timestamp}}.txt"
    direction: "download"

  - type: "file"
    source: "C:\\NetworkMonitoring\\ANALYSIS-SUMMARY.md"
    destination: "./output/analysis-summary-{{timestamp}}.md"
    direction: "download"

  - type: "file"
    source: "C:\\NetworkMonitoring\\domains-Microsoft.txt"
    destination: "./output/domains-Microsoft-{{timestamp}}.txt"
    direction: "download"

  - type: "file"
    source: "C:\\NetworkMonitoring\\domains-AWS.txt"
    destination: "./output/domains-AWS-{{timestamp}}.txt"
    direction: "download"

  - type: "file"
    source: "C:\\NetworkMonitoring\\domains-CircleCI.txt"
    destination: "./output/domains-CircleCI-{{timestamp}}.txt"
    direction: "download"

  - type: "file"
    source: "C:\\NetworkMonitoring\\domains-PackageManagers.txt"
    destination: "./output/domains-PackageManagers-{{timestamp}}.txt"
    direction: "download"

  - type: "file"
    source: "C:\\NetworkMonitoring\\unique-destinations.csv"
    destination: "./output/unique-destinations-{{timestamp}}.csv"
    direction: "download"

  - type: file
    source: "C:\\InstalledSoftware.md"
    destination: "/tmp/artifacts/Vs2019-Server2019-Readme.md"
    direction: "download"

  - type: file
    source: "C:\\test-results.xml"
    destination: "{{ user `test_results_path` }}"
    direction: "download"

  - type: file
    source: "C:\\ProgramData\\chocolatey\\logs\\chocolatey.log"
    destination: "/tmp/artifacts/chocolatey.log"
    direction: "download"
